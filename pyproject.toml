[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readmeorrunme"
version = "0.1.0"
description = "Nightly containerized runner for OSS devtool README quickstarts."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Arshdeep Ghotra", email = "arsh9745774@gmail.com" }]
dependencies = [
  "typer>=0.12",
  "PyYAML>=6.0",
  "markdown-it-py>=3.0",
  "docker>=7.1",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
rormr = "readmeorrunme.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
